<!DOCTYPE HTML>
<html>
<head>
    <title>estilos</title>
    <style>
        h1{
            color: rgb(238, 17, 17);
            font-size: 25px;

        }
        p{
            color: rgb(235, 10, 223);
            font-family: Arial, Helvetica, sans-serif;
        }
        img{
            border: 1px solid black;

        }
    </style>
</head>
<body>
    <!-- Título y párrafo con estilos aplicados desde el bloque <style> -->
    <h1>Titulo en linea</h1>
    <p>parrafo en linea</p>
    <img src="imagen.jpg" style="width: 150px; height: auto;">
    <h1>Titulo en linea para ver el estilo de h1</h1>
    <p>Párrafo en linea para ver el estilo de p</p>
</body>


</html>
